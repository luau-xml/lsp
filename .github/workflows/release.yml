name: Release

# One `.vsix` per platform, because the extension bundles a server binary and a
# binary is for exactly one platform. An untagged build installs anywhere and
# works in one place: on any other it dies with `cannot execute binary file`,
# and the client reports `write EPIPE` five times without naming the reason.
#
# Every target builds on its own runner rather than cross-compiling. The whole
# dependency tree is pure Rust, so cross-building does work — but a native build
# is the one that also *runs* its own tests, and needs no linker arrangements to
# stay correct.

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without inventing a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crate and the extension ship from one tag: the `.vsix` bundles the very
  # binary the crate publishes, so "which server is in extension 0.2.3" has to
  # have an answer. Nothing enforces that on its own, and the failure is only
  # visible afterwards — as a crates.io version that cannot be replaced, and a
  # Marketplace listing claiming a different number than the tag it came from.
  #
  # First, and everything else waits on it. Six platform builds are a slow way
  # to discover a typo in a tag.
  #
  # Read with `sed` and `node` rather than `cargo metadata`, which cannot load
  # this workspace without the pinned compiler beside it — a check that needs a
  # second private checkout to run is not the cheap early gate this is meant to
  # be.
  versions:
    name: versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the versions agree
        shell: bash
        run: |
          set -euo pipefail

          crate=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          extension=$(node -p "require('./editors/vscode/package.json').version")

          echo "crate: $crate"
          echo "extension: $extension"

          if [ "$crate" != "$extension" ]; then
            echo "::error::the crate is $crate and the extension is $extension; they ship from one tag and must match"
            exit 1
          fi

          # Only a tag can disagree with the manifests. A rehearsal run
          # (workflow_dispatch) has nothing to compare against, and the check
          # above is still worth having there.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the manifests, which say $crate"
              exit 1
            fi
            echo "tag: $GITHUB_REF_NAME"
          fi

  build:
    name: ${{ matrix.target }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            rust: aarch64-apple-darwin
          - target: darwin-x64
            os: macos-latest
            rust: x86_64-apple-darwin
          - target: linux-x64
            os: ubuntu-latest
            rust: x86_64-unknown-linux-gnu
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
          - target: win32-x64
            os: windows-latest
            rust: x86_64-pc-windows-msvc
          - target: win32-arm64
            os: windows-11-arm
            rust: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          path: luaux-lsp

      # The same pin CI builds against. A server released against a different
      # compiler than the one producing `build/` reports diagnostics the build
      # does not.
      - name: Read the compiler pin
        id: pin
        shell: bash
        run: |
          cd luaux-lsp
          echo "rev=$(sed -n 's/^rev = //p' LUAUX_PIN)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned compiler
        uses: actions/checkout@v4
        with:
          repository: luau-xml/luaux
          ref: ${{ steps.pin.outputs.rev }}
          path: luaux

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the server
        working-directory: luaux-lsp
        run: cargo build --release --target ${{ matrix.rust }}

      # Where the extension looks for it, and what `package.mjs` checks.
      - name: Bundle the server
        shell: bash
        working-directory: luaux-lsp/editors/vscode
        run: |
          mkdir -p server
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../../target/${{ matrix.rust }}/release/luaux-lsp.exe" server/luaux-lsp.exe
          else
            cp "../../target/${{ matrix.rust }}/release/luaux-lsp" server/luaux-lsp
          fi

      - name: Package
        working-directory: luaux-lsp/editors/vscode
        run: |
          npm install
          npm run compile
          npm run package -- ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: luaux-lsp/editors/vscode/*.vsix
          if-no-files-found: error

  # The server as a crate, so `cargo install luaux-lsp` works and so anything
  # wanting the mapping as a library can depend on it.
  #
  # Its own job rather than a step in `publish`: crates.io is the one channel
  # that cannot be un-published, and a failure here should not take the GitHub
  # Release and the Marketplace down with it.
  crate:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: luaux-lsp

      - name: Read the compiler pin
        id: pin
        shell: bash
        run: |
          cd luaux-lsp
          echo "rev=$(sed -n 's/^rev = //p' LUAUX_PIN)" >> "$GITHUB_OUTPUT"

      # Needed even though the published crate resolves `luaux` from the
      # registry: the path in `[workspace.dependencies]` is what Cargo reads to
      # load the workspace at all, and it cannot get as far as packaging without
      # it.
      - name: Check out the pinned compiler
        uses: actions/checkout@v4
        with:
          repository: luau-xml/luaux
          ref: ${{ steps.pin.outputs.rev }}
          path: luaux

      - uses: dtolnay/rust-toolchain@stable

      # Skipped rather than failed when the secret is absent, like the two
      # publishing steps below: a release should work before an account exists,
      # and a rehearsal run should publish nothing at all.
      #
      # No guard against a version that is already up there. crates.io refuses a
      # duplicate by itself, and re-running a tag is deliberate enough that the
      # error is the right answer rather than a silent success.
      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: luaux-lsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipping crates.io"
            exit 0
          fi
          cargo publish -p luaux-lsp

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true

      - run: ls -l vsix

      # Always. A GitHub Release needs no account and no secret, so this is the
      # channel that cannot silently fail to exist.
      #
      # `generate_release_notes` has GitHub write the "what changed" half from
      # the pull requests merged since the previous tag, grouped by the
      # categories in `.github/release.yml`. `body` is prepended to it rather
      # than replacing it — which is the only place to say which of six files a
      # given machine wants, since the assets themselves cannot explain that.
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vsix/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Install

            One `.vsix` per platform: the extension bundles a server binary, and a
            binary is for exactly one platform. The target is in the manifest as
            well as the filename, so VS Code refuses a mismatched build rather
            than failing at run time.

            | Platform            | Asset                          |
            | ------------------- | ------------------------------ |
            | Windows (x64)       | `luaux-lsp-win32-x64-*.vsix`   |
            | Windows (arm64)     | `luaux-lsp-win32-arm64-*.vsix` |
            | macOS (Apple)       | `luaux-lsp-darwin-arm64-*.vsix`|
            | macOS (Intel)       | `luaux-lsp-darwin-x64-*.vsix`  |
            | Linux (x64)         | `luaux-lsp-linux-x64-*.vsix`   |
            | Linux (arm64)       | `luaux-lsp-linux-arm64-*.vsix` |

            ```console
            $ code --install-extension luaux-lsp-<target>-<version>.vsix
            ```

            Also on the [Marketplace](https://marketplace.visualstudio.com/items?itemName=RyanCundiff.luaux-lsp)
            and [OpenVSX](https://open-vsx.org/extension/RyanCundiff/luaux-lsp),
            where the right build is chosen for you.

            ---

      - name: Install the publishing tools
        working-directory: editors/vscode
        run: npm install

      # Skipped rather than failed when the secret is absent: releases should
      # work before a Marketplace account exists, and a rehearsal run
      # (workflow_dispatch, no tag) should not publish anything at all.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not set — skipping the Marketplace"
            exit 0
          fi
          for vsix in ../../vsix/*.vsix; do
            npx vsce publish --packagePath "$vsix"
          done

      # A meaningful part of the Roblox community uses VSCodium and Cursor, and
      # neither can reach the Marketplace.
      - name: Publish to OpenVSX
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::OVSX_PAT is not set — skipping OpenVSX"
            exit 0
          fi
          for vsix in ../../vsix/*.vsix; do
            npx ovsx publish --packagePath "$vsix" --pat "$OVSX_PAT"
          done
